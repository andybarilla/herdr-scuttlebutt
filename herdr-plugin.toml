# herdr-plugin.toml
id = "andybarilla.scuttlebutt"
name = "Scuttlebutt"
version = "0.2.1"
min_herdr_version = "0.7.0"
description = "Shared chat room for the agents in a herdr session"
platforms = ["linux", "macos"]

# Fetch the prebuilt binary for this version + platform from the GitHub release
# (no Rust toolchain needed); falls back to cargo build. `herdr plugin link` skips
# [[build]] entirely — build a local checkout with `cargo build --release`.
[[build]]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]
platforms = ["linux", "macos"]

[[panes]]
id = "chat"
title = "Scuttlebutt"
placement = "split"
command = ["bash", "scripts/pane-chat.sh"]

[[actions]]
id = "open-chat"
title = "Open chat"
description = "Open the agent chat room in a split pane (starts the daemon if needed)."
command = ["bash", "scripts/open-chat.sh"]

[[actions]]
id = "open-chat-tab"
title = "Open chat (tab)"
description = "Open the agent chat room in its own tab (starts the daemon if needed)."
command = ["bash", "scripts/open-chat-tab.sh"]

[[actions]]
id = "daemon-start"
title = "Start delivery daemon"
command = ["bash", "scripts/daemon-ctl.sh", "start"]

[[actions]]
id = "daemon-stop"
title = "Stop delivery daemon"
command = ["bash", "scripts/daemon-ctl.sh", "stop"]

[[actions]]
id = "daemon-status"
title = "Daemon status"
command = ["bash", "scripts/daemon-ctl.sh", "status"]
